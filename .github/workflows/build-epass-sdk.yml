name: Build ePass ARM SDK

on:
  workflow_dispatch:

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install Buildroot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential fakeroot libncurses-dev libpython3-dev libssl-dev mtd-utils swig unzip wget
      - name: Fetch official Buildroot
        run: git clone --depth 1 https://github.com/rhodesepass/buildroot.git "$RUNNER_TEMP/buildroot"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/buildroot/dl
          key: epass-buildroot-dl-${{ runner.os }}-${{ hashFiles('tools/normalize_crlf_tree.py') }}
          restore-keys: epass-buildroot-dl-${{ runner.os }}-
      - name: Normalize upstream text files
        run: python3 tools/normalize_crlf_tree.py "$RUNNER_TEMP/buildroot"
      - name: Configure and build ARM toolchain
        working-directory: ${{ runner.temp }}/buildroot
        run: |
          make rhodesisland_epass_defconfig
          make toolchain libdrm -j"$(nproc)"
      - name: Fetch official application HAL
        run: |
          git clone --depth 1 https://github.com/rhodesepass/epass-applications.git "$RUNNER_TEMP/epass-applications"
          python3 tools/normalize_crlf_tree.py "$RUNNER_TEMP/epass-applications"
      - name: Build ARM application package
        run: |
          cmake -S . -B build-device \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/buildroot/output/host/share/buildroot/toolchainfile.cmake" \
            -DEPASS_NATIVE=ON \
            -DEPASS_APPLICATIONS_ROOT="$RUNNER_TEMP/epass-applications" \
            -DBUILD_TESTING=OFF
          cmake --build build-device --parallel
          file build-device/daily_terminal
          OUT_DIR="$RUNNER_TEMP/device-package" sh tools/package_app.sh build-device/daily_terminal
      - name: Archive relocatable SDK
        working-directory: ${{ runner.temp }}/buildroot
        run: |
          support/scripts/fix-rpath host
          install -m 755 support/misc/relocate-sdk.sh output/host/relocate-sdk.sh
          mkdir -p output/host/share/buildroot
          printf '%s\n' "$PWD/output/host" > output/host/share/buildroot/sdk-location
          tar -czf "$RUNNER_TEMP/epass-arm-sdk.tar.gz" \
            --owner=0 --group=0 --numeric-owner \
            --transform='s#^output/host#epass-arm-sdk#' output/host
          (cd "$RUNNER_TEMP" && sha256sum epass-arm-sdk.tar.gz > epass-arm-sdk.tar.gz.sha256)
          (cd "$RUNNER_TEMP/device-package" && sha256sum rhodes-daily-terminal-v*.tar.gz > rhodes-daily-terminal.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: epass-arm-sdk
          path: |
            ${{ runner.temp }}/epass-arm-sdk.tar.gz
            ${{ runner.temp }}/epass-arm-sdk.tar.gz.sha256
            ${{ runner.temp }}/device-package/*.tar.gz
            ${{ runner.temp }}/device-package/*.sha256
          if-no-files-found: error
          retention-days: 7
